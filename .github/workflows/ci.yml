name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check the committed Tailwind CSS is up to date
      run: npm run check:css

    - name: Install Chromium for browser smoke tests
      run: npx playwright install --with-deps chromium

    - name: Run the full repository validation gate
      # This is the same versioned gate used by the scheduled update workflow.
      # Automatic data updates therefore cannot reach main without the checks
      # that protect pull requests passing as well.
      run: npm run ci:validate
