name: Update EMT Dashboard

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  pages: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Update dashboard data
      env:
        CSV_URL: ${{ vars.CSV_URL || secrets.CSV_URL || '' }}
        DATE_URL: ${{ vars.DATE_URL || secrets.DATE_URL || '' }}
        NON_COMPLIANT_URL: ${{ vars.NON_COMPLIANT_URL || secrets.NON_COMPLIANT_URL || '' }}
        CASPS_URL: ${{ vars.CASPS_URL || secrets.CASPS_URL || '' }}
      run: node update-data.js

    - name: Check for changes
      id: verify-changed-files
      shell: bash
      run: |
        # A new snapshot directory is untracked, so use status rather than
        # git diff when deciding whether the update produced work.
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --short
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No data changes detected."
        fi

    - name: Install Chromium for the full validation gate
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium

    - name: Check generated CSS and run the full validation gate
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        npm run check:css
        npm run ci:validate

    - name: Commit update on an automation branch
      if: steps.verify-changed-files.outputs.changed == 'true'
      id: commit-update
      shell: bash
      run: |
        set -euo pipefail
        branch='automation/dashboard-update'
        git checkout -B "$branch"
        git config user.email 'action@github.com'
        git config user.name 'GitHub Action Bot'
        git add index.html casp-tracker.html emt-tracker.html non-compliant-casps.html entities/ data/ feed.xml sitemap.xml
        git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 0; }
        git commit -m "🤖 Auto-update dashboard data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
        git push --force-with-lease origin "HEAD:$branch"
        echo "branch=$branch" >> "$GITHUB_OUTPUT"

    - name: Create or update the dashboard update pull request
      if: steps.verify-changed-files.outputs.changed == 'true'
      id: update-pr
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        branch='automation/dashboard-update'
        pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number')"
        if [ -z "$pr_number" ]; then
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title 'Automated dashboard update' \
            --body $'This pull request was generated by the scheduled data updater.\n\nIt is intentionally gated by the full repository CI suite before it can merge to main and reach GitHub Pages.')"
          pr_number="${pr_url##*/}"
        fi
        echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
        echo "Dashboard update PR: #$pr_number"

    # The generated update has already passed the same full validation gate
    # above, against the exact files that are committed to the automation
    # branch. Bot-created pull_request workflow runs may be held for manual
    # approval by GitHub and therefore report no checks to `gh pr checks`.
    # Waiting on that optional duplicate run would make an otherwise validated
    # data update fail before it can merge.
    - name: Confirm generated update passed the validation gate
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: echo 'The generated update passed the full repository validation gate.'

    - name: Merge the validated update pull request
      if: steps.verify-changed-files.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr merge "${{ steps.update-pr.outputs.pr_number }}" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

    - name: Trigger GitHub Pages build
      if: steps.verify-changed-files.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

    - name: Summary
      run: |
        if [ "${{ steps.verify-changed-files.outputs.changed }}" = "true" ]; then
          echo 'Dashboard update validated, merged to main, and Pages rebuild requested.'
        else
          echo 'Dashboard was already up to date.'
        fi
